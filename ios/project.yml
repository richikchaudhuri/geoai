name: GeoAI
options:
  bundleIdPrefix: com.geoai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GeoAICore:
    path: Packages/GeoAICore
targets:
  GeoAI:
    type: application
    platform: iOS
    sources:
      - path: GeoAI
        excludes:
          - Resources
          - Info.plist
      - path: GeoAI/Resources
        buildPhase: resources
    dependencies:
      - package: GeoAICore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geoai.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GeoAI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: true
      environmentVariables:
        OS_ACTIVITY_MODE: default
